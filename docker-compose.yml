services:
  # ---------------------------------------------------------------------
  # Couchbase Server — the shared operational store, per-entity agent-
  # decision context cache, and operator accept/reject audit log for all
  # ten industries. Enterprise Edition, run under Couchbase's developer/
  # free license (no key or account needed for this use case) — see the
  # reference Procurement Command Center app's README for the license
  # rationale, which applies unchanged here.
  # ---------------------------------------------------------------------
  couchbase:
    image: couchbase:enterprise-8.0.2
    container_name: aidp-couchbase
    restart: unless-stopped
    ports:
      # Remapped from Couchbase's usual 8091/8093 to 9191/9193 so this
      # stack can run alongside BOTH the Couchbase Agent Operations
      # Manager (which binds 8091-8096 for its own separate cluster) and
      # the reference Procurement Command Center demo (which uses
      # 9091/9093) on the same machine. Only the host-facing side changes;
      # backend<->couchbase traffic below stays on the internal Docker
      # network and is unaffected.
      - "9191:8091" # Couchbase admin UI (Administrator / password123 after first boot)
      - "9193:8093" # N1QL query service
    volumes:
      - couchbase-data:/opt/couchbase/var
    healthcheck:
      # No -f: this Couchbase Server version answers /pools with 401 as
      # soon as the node process is up (auth or no auth) — curl -f treats
      # any >=400 as a hard failure, which would report "unhealthy"
      # forever even on a perfectly healthy node. See the reference
      # Procurement Command Center app's docker-compose.yml for the full
      # story on both this and the widened start_period/retries below
      # (two contended Couchbase Enterprise boots on one machine — this
      # stack's and AOM's own — can each take well over two minutes).
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8091/pools"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 40

  # ---------------------------------------------------------------------
  # This app's bundled industry MCP tool servers (see mcp-servers/app/
  # main.py) — one FastMCP endpoint per vertical. Registered with AOM by
  # scripts/register_with_aom.py so AOM's operations-manager can discover
  # and invoke them under RBAC, exactly like any other MCP server it
  # proxies to.
  # ---------------------------------------------------------------------
  mcp-servers:
    build: ./mcp-servers
    container_name: aidp-mcp-servers
    restart: unless-stopped
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  backend:
    build: ./backend
    container_name: aidp-backend
    restart: on-failure:3
    depends_on:
      couchbase:
        condition: service_healthy
    # Resolves host.docker.internal on Linux Docker Engine too (Docker
    # Desktop on macOS/Windows already does this automatically) — needed
    # so AOM_BASE_URL's default (the separate AOM docker-compose stack on
    # the same machine) works regardless of platform.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 4100
      COUCHBASE_MGMT_URL: http://couchbase:8091
      COUCHBASE_QUERY_URL: http://couchbase:8093
      COUCHBASE_USERNAME: Administrator
      COUCHBASE_PASSWORD: password123
      COUCHBASE_BUCKET: aidp_industries
      # The Couchbase Agent Operations Manager — a separate docker-compose
      # stack on the same machine by default (see README "Running both
      # stacks"). Every LLM narration and MCP tool cross-check in this app
      # goes through the real aom_sdk Python client at this address; with
      # no AOM reachable, every agent/copilot path falls back to its own
      # deterministic, rule-based text with no loss of functionality.
      AOM_BASE_URL: ${AOM_BASE_URL:-https://host.docker.internal:8090}
      AOM_API_KEY: ${AOM_API_KEY:-demo-admin-4c56}
      AOM_VERIFY_SSL: ${AOM_VERIFY_SSL:-false}
      AOM_PROVIDER: ${AOM_PROVIDER:-}
      AOM_MODEL: ${AOM_MODEL:-}
      AOM_AGENT_ID: ${AOM_AGENT_ID:-aidp-industries-demo}
    ports:
      - "4100:4100"

  frontend:
    build: ./frontend
    container_name: aidp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    volumes:
      # Bind-mounted on top of the image's own COPY (see frontend/
      # Dockerfile) so editing frontend/public/*.{html,css,js} shows up on
      # a browser refresh — no rebuild needed. Read-only: nginx never
      # writes here.
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  couchbase-data:
